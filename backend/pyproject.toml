[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
authors = [
  {name = "Robert Krivic"},
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "anthropic>=0.69.0",
    "click>=8.1.8",
    "flask>=3.0.3",
    "flask-cors>=5.0.0",
    "google-auth>=2.50.0",
    "google-cloud-storage>=2.18.0",
    "hydra-core>=1.3.2",
    "json-fix>=1.0.0",
    "json-repair>=0.30.0",
    "litellm>=1.77.7",
    "numpy>=1.26",
    "omegaconf>=2.3.0",
    "openai>=1.86.0",
    "playwright>=1.48.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.1",
    "regex>=2024.0.0",
    "tiktoken>=0.7.0",
    "werkzeug>=3.0.6",
]
description = "UXAgent backend — LLM-driven Playwright agents that audit a website as synthetic UX-research participants."
dynamic = ["version"]
keywords = []
license = "MIT"
name = "simulated-web-agent"
readme = "README.md"
requires-python = ">=3.12"

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[project.urls]
Documentation = "https://github.com/robertkrivic/UX_AGENT#readme"
Issues = "https://github.com/robertkrivic/UX_AGENT/issues"
Source = "https://github.com/robertkrivic/UX_AGENT"

[tool.hatch.version]
path = "src/simulated_web_agent/__about__.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/simulated_web_agent tests}"

[tool.coverage.run]
branch = true
omit = [
  "src/simulated_web_agent/__about__.py",
]
parallel = true
source_pkgs = ["simulated_web_agent", "tests"]

[tool.coverage.paths]
simulated_web_agent = ["src/simulated_web_agent", "*/simulated-web-agent/src/simulated_web_agent"]
tests = ["tests", "*/simulated-web-agent/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff.lint]
ignore = ["F401"]
select = ["E4", "E7", "E9", "F", "I"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.basedpyright]
typeCheckingMode = "basic"
